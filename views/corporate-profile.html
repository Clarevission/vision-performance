S contacts", "ERP plans and drills", "Genuine screen from a local build of the application, shown with fictional demonstration data. Names, organizations and figures are not real and do not represent VPI clients or activity.", "VPI Technology"], "alts": ["VPI SafetyOS incidents and learning teams register", "VPI SafetyOS lockout permit on a phone"], "links": [{"href": "https://safetyos.visionperformanceinc.ca/", "x": 0.6495, "y": 0.2422, "w": 0.2819, "h": 0.0135}]}, {"n": 21, "title": "SafetyOS workflow", "text": ["VPI SafetyOS™ · Connected records", "One system for the whole safety program.", "Not a stack of separate tools that each hold a piece of the picture. The same records connect: an incident raises a finding, a finding becomes an action, an action is verified.", "Hazard", "Activity", "Event / inspection", "Finding", "Corrective action", "Verification", "Learning & analytics", "What is learned returns to the hazard register.", "VPI SafetyOS · Incident detail", "VPI SafetyOS · Corrective actions", "VPI SafetyOS · ISO 45001 audit", "Built so records hold up", "Every change is on the record", "Who did what, and when, is written to an append- only audit trail.", "Companies stay separate", "Every query is scoped to the signed-in company, tested on every code change.", "Learning, not blame", "Incident reports ask about conditions and error traps, in line with HOP practice.", "Audit content is data", "Audit questions live in protocol records, so they update without a software release.", "Genuine screen from a local build of the application, shown with fictional demonstration data. Names, organizations and figures are not real and do not represent VPI clients or activity.", "VPI Technology"], "alts": ["VPI SafetyOS incident detail with error traps and conditions", "VPI SafetyOS corrective actions board", "VPI SafetyOS ISO 45001 audit scoring workspace", "VPI SafetyOS dashboard on a phone"], "links": []}, {"n": 22, "title": "VPI Mires", "text": ["VPI Mires · Exam charting", "Eye-care technology", "Practice management built for optometry.", "Available now", "One system for scheduling, exams, billing and dispensary—built for how optometry and optical clinics actually run, across every location.", "mires.visionperformanceinc.ca", "Scheduling & recall", "Book, confirm and remind, with self-booking and automated recall.", "Clinical exam / EHR", "Refraction, contact lens fitting and full exam charting built for optometry.", "Billing & claims", "Public and private-pay billing workflows in one place.", "Dispensary & inventory", "Frame catalogue, contact lens ordering and multi-location inventory.", "Patient portal", "Booking, messaging and document access for patients.", "Compliance, built in", "Tenant isolation, audit logging and consent management.", "Genuine screen from a local build of the application, shown with fictional demonstration data. Names, organizations and figures are not real and do not represent VPI clients or activity.", "VPI Technology"], "alts": ["VPI Mires exam charting with visual acuity by eye"], "links": [{"href": "https://mires.visionperformanceinc.ca/", "x": 0.6127, "y": 0.2638, "w": 0.3186, "h": 0.0135}]}, {"n": 23, "title": "Mires workflow", "text": ["VPI Mires™ · One practice, one system", "Follow the patient, not the software.", "Mires connects the patient journey across front desk, clinical, optical and administrative work, so each step picks up where the last one left off.", "Patient", "Booking", "Front desk", "Clinical exam", "Prescription", "Optical dispensary", "Billing / claims", "Recall", "VPI Mires · Schedule", "VPI Mires · Exam worklist", "VPI Mires · Invoice", "VPI Mires · Patients", "Front desk", "Booking, check-in, confirmations and recall lists.", "Clinical", "Refraction, exam charting and prescriptions in one record.", "Optical", "Frames, lenses, orders and inventory by location.", "Administration", "Billing, claims and reporting across every location.", "Genuine screen from a local build of the application, shown with fictional demonstration data. Names, organizations and figures are not real and do not represent VPI clients or activity.", "VPI Technology"], "alts": ["VPI Mires scheduling calendar", "VPI Mires exam worklist", "VPI Mires patient invoice", "VPI Mires patient list"], "links": []}, {"n": 24, "title": "VPI Command Centre", "text": ["Internal platform · Not offered for sale", "The operating system behind VPI.", "VPI Command Centre is proprietary infrastructure used by VPI staff only. It coordinates the people, places and paperwork behind every program.", "COMMAND CENTRE", "Command Centre · Dashboard", "Command Centre · Reports", "Scheduling", "Appointments and visits planned around shifts and sites.", "Logistics", "Mobile-service routing and deployment planning.", "Client coordination", "Employer contacts, programs and eligibility in one place.", "Service delivery", "Each step of a program tracked from request to completion.", "Reporting", "Program-level reporting for employers and for VPI oversight.", "Invoicing", "Billing tied to delivered services.", "Internal workflows", "Approvals, hand-offs and administration.", "Workforce coordination", "Matching the right people to each visit and program.", "Building operational infrastructure before scaling physical service delivery is part of VPI’s deliberate growth model.", "The same engineering discipline stands behind VPI SafetyOS™ and VPI Mires™.", "Genuine screen from a local build of the application, shown with fictional demonstration data. Names, organizations and figures are not real and do not represent VPI clients or activity.", "VPI Technology"], "alts": ["Vision Performance Inc.", "VPI Command Centre reports screen"], "links": []}, {"n": 25, "title": "Connected technology architecture", "text": ["Connected architecture", "Current roles and planned connections, kept explicit.", "Current role (live)", "Internal platform", "Planned / not yet built", "Who uses it", "VPI technology", "Service delivery", "Employers & HSE teams", "Workers", "Eye-care practices", "VPI staff", "VPI SafetyOS™", "Available now", "VPI Mires™", "Available now", "VPI Command Centre", "Internal platform", "Occupational vision programs", "In development", "Mobile vision clinics", "Planned", "Clinical & optical network", "Planned", "Live today. Safety teams and workers use VPI SafetyOS™; optometry and optical practices use VPI Mires™; VPI staff use VPI Command Centre.", "Planned. Command Centre is intended to schedule and record occupational and mobile services, and to support referral to the planned clinical network, as those services launch.", "The diagram shows roles, not data integrations. Integrations between products will be described only once they are technically defined and built.", "VPI Technology"], "alts": [], "links": []}, {"n": 26, "title": "Worker journey", "text": ["The worker’s view", "One pathway a worker can actually follow.", "The ecosystem becomes clearest from the worker’s side: fewer hand-offs, clear information, and clinical details that stay private.", "Illustrative future state", "Role & needs identified", "Program information explains what is covered and why.", "Role and hazard profile", "Authorization", "A simple approval, with no health details requested.", "Eligibility status only", "Eye examination", "With the worker’s own eye-care provider, or by referral.", "Stays with the provider", "Selection", "Choose from approved styles suited to the role’s hazards.", "Style and coverage", "Fitting", "Fitted for comfort, coverage and other PPE.", "Fit confirmed", "At work", "Eyewear that corrects vision and protects the eyes, all shift.", "Replacement", "On schedule, or sooner after damage or a new prescription.", "Replacement record", "What the employer’s program record holds at each step", "Less time off shift", "Planned mobile clinics would bring selected services on or near site.", "Clear information", "Workers know what is covered, and how to use it.", "Privacy by design", "Exam results stay between the worker and the eye-care professional.", "Illustrative future-state journey; not a claim of current service deployment. Stock photograph.", "Value & Trust"], "alts": ["Smiling woman adjusting her eyeglasses"], "links": []}, {"n": 27, "title": "Value across the ecosystem", "text": ["Value", "Built around what employers actually manage.", "People", "Access to eye care and clear program information for every eligible worker.", "Program", "Eligibility, authorization and replacement rules set once and applied consistently.", "Safety", "Visual requirements considered alongside the hazards in the hazard assessment.", "Operations", "Scheduling, administration and reporting handled with less internal effort.", "Different stakeholders, one underlying system", "Stakeholder", "What they gain", "How VPI delivers it", "Workers", "Eyewear that both corrects and protects; care closer to work", "Clear pathways, privacy by design", "Employers & HR", "A structured, auditable vision program", "Program design, authorization, reporting", "HSE teams", "Eye protection aligned with the hazard assessment", "Hazard-aligned eyewear pathway, PPE compatibility", "Eye-care practices", "Purpose-built practice software; future referral ecosystem", "VPI Mires™; planned referral pathways", "Industry & eyewear partners", "A program channel for protective eyewear", "Supply and program integration", "Financing partners", "A company building infrastructure before scaling", "Staged, status-labelled growth plan", "Value statements describe intended program outcomes. VPI does not claim measured reductions in injuries, costs or claims.", "Value & Trust"], "alts": [], "links": []}, {"n": 28, "title": "Privacy and responsible technology", "text": ["Privacy & responsible technology", "Built with trust as a design requirement.", "Privacy, security and accountability are part of how programs and software are designed—not decoration added afterwards.", "Worker & eye-care provider", "Clinical side", "Worker", "Holds the clinical relationship", "Eye-care provider", "Examination, prescription, clinical record", "Referral", "Onward care when needed", "Employer program administration", "Program side", "Eligibility & authorization", "Who is covered, and at what level", "Participation & activity", "Program records and spend", "VPI program operations", "Role-based access to what each task needs", "Privacy boundary", "Permitted reporting", "Authorization status and participation cross. Personal health information does not.", "Principles", "Minimum necessary", "Collect only what each step requires.", "Clinical privacy", "Exam results stay with the worker and provider.", "Role-based access", "People see what their role requires.", "Auditability", "Changes are traceable to a person and a time.", "Separation", "Employer administration and clinical information kept apart.", "Responsible development", "Tested, reviewed and changed deliberately.", "Verified claims only", "Compliance is stated only where independently verified.", "VPI does not claim formal certification or regulatory compliance status in this profile. Such statements will be made only where independently verified.", "Value & Trust"], "alts": [], "links": []}, {"n": 29, "title": "Built in Alberta", "text": ["Edmonton, Alberta", "Home base, and the starting point for VPI’s programs.", "Growth strategy", "Built in Alberta. Designed to scale.", "Start focused, build the infrastructure, prove the model, then expand deliberately.", "Foundation", "We are here", "Technology and corporate infrastructure", "Alberta validation", "Employer programs and partnerships", "Canadian expansion", "Broader service delivery across provinces", "Selective North American expansion", "Where the model and partners fit", "Longer-term international opportunity", "Considered once the model is proven", "Stages describe strategic intent, not dates or commitments. Each stage depends on validation of the one be inc.ca/contact", "Company"], "alts": [], "links": [{"href": "https://visionperformanceinc.ca/contact", "x": 0.0686, "y": 0.7697, "w": 0.4657, "h": 0.0271}, {"href": "mailto:info@visionperformanceinc.ca", "x": 0.0686, "y": 0.8081, "w": 0.4657, "h": 0.0123}, {"href": "https://visionperformanceinc.ca/contact", "x": 0.576, "y": 0.7481, "w": 0.1275, "h": 0.0985}, {"href": "https://visionperformanceinc.ca/contact", "x": 0.7181, "y": 0.7972, "w": 0.1978, "h": 0.0142}]}, {"n": 32, "title": "Back cover", "text": ["Vision. Safety. Technology.", "A connected approach to how people see at work.", "Vision Performance Inc.", "VPI SafetyOS™", "VPI Mires™", "visionperformanceinc.ca · info@visionperformanceinc.ca Edmonton, Alberta, Canada", "Service status as published by Vision Performance Inc., September 2026. Planned and in-development services may change or may not launch. Photography: licensed stock images (Unsplash Licence); people and places shown are not VPI staff, clients or sites. Mobile clinic image is a concept livery render. Software screens are from local builds with fictional demonstration data. © 2026 Vision Performance Inc."], "alts": ["Vision Performance Inc."], "links": [{"href": "https://visionperformanceinc.ca/", "x": 0.2818, "y": 0.5777, "w": 0.1127, "h": 0.0871}, {"href": "https://safetyos.visionperformanceinc.ca/", "x": 0.4676, "y": 0.5777, "w": 0.1127, "h": 0.0871}, {"href": "https://mires.visionperformanceinc.ca/", "x": 0.6293, "y": 0.5777, "w": 0.1127, "h": 0.0871}, {"href": "https://visionperformanceinc.ca/", "x": 0.3115, "y": 0.7595, "w": 0.1604, "h": 0.0133}, {"href": "mailto:info@visionperformanceinc.ca", "x": 0.4904, "y": 0.7595, "w": 0.1981, "h": 0.0133}]}], "sections": [{"n": "01", "name": "Context", "page": 2}, {"n": "02", "name": "Ecosystem", "page": 7}, {"n": "03", "name": "Occupational Vision", "page": 9}, {"n": "04", "name": "Mobile & Clinical Care", "page": 14}, {"n": "05", "name": "VPI Technology", "page": 18}, {"n": "06", "name": "Value & Tr
