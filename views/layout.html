<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
{{canonical_tag}}
<meta name="theme-color" content="#00071A">
<meta property="og:site_name" content="Vision Performance Inc.">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
{{og_url_tag}}
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_CA">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">
<link rel="icon" href="/assets/img/vpi-favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/img/vpi-icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/vpi-apple-touch-icon.png">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preload" href="/assets/fonts/inter-latin-v20.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/montserrat-latin-v31.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset_css}}">
{{jsonld}}
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">Skip to main content</a>
{{> icons}}
{{> announcement}}
{{> header}}
<main id="main" tabindex="-1">
{{content}}
</main>
{{> footer}}
<script src="{{asset_js}}" defer></script>
{{analytics_tag}}
</body>
</html>
