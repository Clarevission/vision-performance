<div class="page-hero">
  <div class="container">
    {{breadcrumbs}}
    <div class="page-hero__grid">
      <div class="page-hero__text">
        {{#$eyebrow}}<p class="eyebrow eyebrow--on-dark">{{$eyebrow}}</p>{{/$eyebrow}}
        <h1 class="page-hero__title">{{$title}}</h1>
        {{#$lede}}<p class="page-hero__lede">{{$lede}}</p>{{/$lede}}
        {{#$status}}<div class="page-hero__status">{{> status kind="{{$status}}"}}{{#$status_note}}<span class="page-hero__status-note">{{$status_note}}</span>{{/$status_note}}</div>{{/$status}}
      </div>
      {{#$icon}}<div class="page-hero__mark" aria-hidden="true"><svg class="icon"><use href="#{{$icon}}"/></svg></div>{{/$icon}}
    </div>
  </div>
</div>
